<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA PAZ — Hub</title>
<style>
:root{
  --bg:#f4f3f0;--panel:#fbfaf8;--p2:#ececea;--line:#dedcd7;
  --text:#2b2a28;--muted:#8b8983;--accent:#7a776f;
  --arara:#3b6ea5;--boto:#d46fa0;--ipe:#e8b93a;
  --selva:#4c8c5c;--onca:#d97a2b;--acai:#7a5ca8;
  font-family:'Calibri',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh}
h2,h3{font-family:'Cambria',Georgia,serif;font-weight:600}

/* HEADER */
header{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 20px 8px;max-width:1100px;margin:0 auto}
.brand-dot{width:11px;height:11px;border-radius:50%;background:conic-gradient(var(--arara),var(--boto),var(--ipe),var(--selva),var(--onca),var(--acai))}
.brand h2{font-size:17px;letter-spacing:.4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 20px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
nav button.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* TABS */
.tab{display:none;max-width:1100px;margin:0 auto;padding:20px 20px 80px}
.tab.active{display:block}

/* UTILS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{background:var(--p2);border:1px solid var(--line);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--bg)}
input,select,textarea{background:var(--p2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.muted{color:var(--muted);font-size:13px}
.sec-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.sec-bar span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative}
.mbox h3{font-family:'Cambria',serif;margin-bottom:14px}
.xbtn{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfield{margin-bottom:10px}

/* ── FEED ── */
.bio{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.bio-av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--p2);border:2px solid var(--line);flex-shrink:0;cursor:pointer}
.bio-stats{display:flex;gap:20px;margin-top:8px}
.bio-stats div{text-align:center}
.bio-stats b{display:block;font-size:16px;font-family:'Cambria',serif}
.bio-stats span{font-size:11px;color:var(--muted)}
.hls{display:flex;gap:14px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;scrollbar-width:none}
.hls::-webkit-scrollbar{display:none}
.hl{text-align:center;flex:0 0 auto}
.hl-c{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:var(--p2);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;cursor:pointer}
.hl-c img{width:100%;height:100%;object-fit:cover}
.hl-cam{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;font-size:15px;border-radius:50%}
.hl:hover .hl-cam{display:flex}
.hl-lbl{font-size:11px;color:var(--muted);margin-top:5px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.gi{position:relative;aspect-ratio:1;background:var(--p2);overflow:hidden;cursor:pointer;border-radius:2px}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
.gi .gbadge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;font-size:11px;color:#fff}
.gi .ghandle{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.5);color:#fff;border-radius:4px;font-size:11px;padding:2px 5px;cursor:grab;display:none}
.gi:hover .ghandle{display:block}
.gi.dragging{opacity:.4}
.gi.dragover{outline:2px solid var(--accent);outline-offset:-2px}
.gi .gph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px}
.add-gi{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);cursor:pointer;border-radius:2px;aspect-ratio:1}
.add-gi:hover{border-color:var(--accent);color:var(--accent)}
.car-track{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.car-track img,.car-track video{height:190px;border-radius:8px;object-fit:cover;flex-shrink:0}
.ci{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab}
.ci img,.ci video{width:48px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0}
.ci.cidrag{opacity:.4}

/* ── PLANEJAMENTO ── */
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.pbar select,.pbar input{width:auto;flex:1;min-width:110px}
.pcards{display:flex;flex-direction:column;gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .15s}
.pc:hover{box-shadow:0 2px 14px rgba(0,0,0,.07)}
.pc-top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.pc-title{font-size:16px;font-weight:700;font-family:'Cambria',serif;outline:none;display:block;margin-bottom:8px;min-height:24px}
.pc-title:empty:before{content:'Título...';color:var(--muted);font-style:italic}
.pc-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pc-mid{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pf label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:3px}
.pf select,.pf input[type=date]{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;font-size:13px;width:100%;-webkit-appearance:none}
.pf [contenteditable]{display:block;font-size:13px;border-bottom:1px solid var(--line);padding:4px 0;outline:none;min-height:22px}
.pf-full{grid-column:1/-1}
.pc-bot{padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.pc-bot input{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0;font-size:12px;color:var(--muted);width:150px}
.pcdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:.45}
.pcdel:hover{opacity:1;color:var(--boto)}
.s-Ideia{background:rgba(139,137,131,.12);color:var(--muted)}
.s-Planejado{background:rgba(59,110,165,.15);color:var(--arara)}
.s-Roteiro{background:rgba(122,92,168,.15);color:var(--acai)}
.s-Produção{background:rgba(212,111,160,.15);color:var(--boto)}
.s-Edição{background:rgba(217,122,43,.15);color:var(--onca)}
.s-Aprovação{background:rgba(232,185,58,.2);color:#8a6a00}
.s-Agendado{background:rgba(76,140,92,.15);color:var(--selva)}
.s-Publicado{background:rgba(76,140,92,.25);color:var(--selva)}
.s-Arquivado{background:rgba(139,137,131,.1);color:var(--muted)}

/* ── MINHA HORA ── */
.hora-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:640px){.hora-grid{grid-template-columns:1fr}}
.hbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.hbox h3{font-size:15px;margin-bottom:14px}
.curr-row{display:flex;gap:6px;margin-bottom:14px}
.curr-row button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--p2);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.curr-row button.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.hresult{background:var(--text);color:var(--bg);border-radius:12px;padding:16px;text-align:center;margin-top:14px}
.hresult .big{font-size:36px;font-weight:700;font-family:'Cambria',serif}
.hresult .sub{font-size:12px;opacity:.6;margin-top:3px}
.costs-list{max-height:190px;overflow-y:auto;margin-bottom:8px}
.crow{display:grid;grid-template-columns:1fr 90px 26px;gap:6px;margin-bottom:5px;align-items:center}
.crow input{font-size:12px;padding:5px 8px}
.cdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.fkpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.fk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.fk .fv{font-size:20px;font-weight:700;font-family:'Cambria',serif}
.fk .fl{font-size:11px;color:var(--muted);margin-top:2px}
.ftbl{width:100%;border-collapse:collapse;font-size:13px}
.ftbl th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.ftbl td{padding:7px 8px;border-bottom:1px solid var(--line)}

/* ── TABELA DE PREÇOS ── */
.svc-cat{margin-bottom:20px}
.cat-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);padding:6px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none}
.srow{display:grid;grid-template-columns:1fr 58px 120px 26px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:none}
.sn{font-size:13px;outline:none}
.sh input{font-size:12px;text-align:right;padding:4px 6px}
.sv{font-size:13px;font-weight:600;text-align:right;outline:none;min-width:90px}
.sdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:.35}
.sdel:hover{opacity:1}
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pk{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px}
.pk.feat{border-color:var(--acai)}
.pk-disc{display:inline-block;background:var(--ipe);color:#111;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:8px}
.pk h4{font-size:14px;margin-bottom:6px;outline:none}
.pk-price{font-size:26px;font-weight:700;font-family:'Cambria',serif;color:var(--acai)}
.pk-orig{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:8px}
.pk-items{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8}
.backup-bar{display:flex;justify-content:flex-end;margin-bottom:16px}
.sync{position:fixed;bottom:14px;right:14px;width:9px;height:9px;border-radius:50%;background:#ccc;z-index:99;transition:background .4s}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-dot"></div><h2>DA PAZ · Hub</h2></div>
  <nav id="nav">
    <button data-tab="feed" class="active">Feed</button>
    <button data-tab="plan">Planejamento</button>
    <button data-tab="hora">Minha Hora</button>
    <button data-tab="precos">Tabela de Preços</button>
  </nav>
</header>

<!-- FEED -->
<section class="tab active" id="tab-feed">
  <div class="card bio" style="margin-bottom:16px">
    <label style="cursor:pointer">
      <img class="bio-av" id="bioAv" src="" onerror="this.style.display='none'" alt="">
      <input type="file" id="bioAvIn" accept="image/*" style="display:none">
    </label>
    <div style="flex:1">
      <div contenteditable id="bioName" style="font-weight:700;font-size:15px">@dapaz.creater</div>
      <div contenteditable id="bioText" class="muted" style="margin:4px 0;font-size:13px">Observe. Conecte-se. Crie.</div>
      <div class="bio-stats">
        <div><b contenteditable id="bioPosts">0</b><span>posts</span></div>
        <div><b contenteditable id="bioFoll">0</b><span>seguidores</span></div>
        <div><b contenteditable id="bioFing">0</b><span>seguindo</span></div>
      </div>
    </div>
  </div>
  <div class="hls" id="hlRow"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span class="muted" style="font-size:12px">Arraste para reordenar</span>
    <button class="btn pri" onclick="openEditor()">+ Novo post</button>
  </div>
  <div class="grid3" id="feedGrid"></div>
</section>

<!-- PLANEJAMENTO -->
<section class="tab" id="tab-plan">
  <div class="pbar">
    <select id="fMes" onchange="renderPlan()"><option value="">Mês</option></select>
    <select id="fPilar" onchange="renderPlan()">
      <option value="">Pilar</option>
      <option>DA PAZ</option><option>Projetos</option><option>Processo</option><option>Cultura</option>
      <option>Ideias</option><option>Matéria</option><option>IA</option><option>Artistas</option>
      <option>Pessoas</option><option>Comercial</option>
    </select>
    <select id="fSt" onchange="renderPlan()">
      <option value="">Status</option>
      <option>Ideia</option><option>Planejado</option><option>Roteiro</option><option>Produção</option>
      <option>Edição</option><option>Aprovação</option><option>Agendado</option><option>Publicado</option><option>Arquivado</option>
    </select>
    <select id="fFmt" onchange="renderPlan()">
      <option value="">Formato</option>
      <option>Reel</option><option>Carrossel</option><option>Post estático</option><option>Stories</option>
      <option>Vídeo</option><option>Live</option><option>Newsletter</option>
    </select>
    <input id="fQ" placeholder="buscar..." oninput="renderPlan()" style="flex:2;min-width:120px">
    <button class="btn pri" onclick="addCard()">+ Conteúdo</button>
  </div>
  <div class="pcards" id="pcards"></div>
</section>

<!-- MINHA HORA -->
<section class="tab" id="tab-hora">
  <div class="hora-grid">
    <div class="hbox">
      <h3>🧮 Calculadora de hora</h3>
      <div class="curr-row">
        <button id="bBRL" class="active" onclick="setCurr('BRL')">R$ Real</button>
        <button id="bUSD" onclick="setCurr('USD')">$ Dólar</button>
      </div>
      <div class="row2" style="margin-bottom:12px">
        <div class="mfield"><label>Salário líquido/mês</label><input type="number" id="cSal" value="6000" oninput="calcH()"></div>
        <div class="mfield"><label>Horas por dia</label><input type="number" id="cHpd" value="4" oninput="calcH()"></div>
        <div class="mfield"><label>Dias por semana</label><input type="number" id="cDpw" value="5" oninput="calcH()"></div>
        <div class="mfield"><label>Semanas de férias/ano</label><input type="number" id="cFer" value="2" oninput="calcH()"></div>
      </div>
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px">Custos fixos mensais</div>
      <div class="costs-list" id="costsList"></div>
      <button class="btn" style="font-size:12px;width:100%;margin-bottom:4px" onclick="addCost()">+ custo fixo</button>
      <div class="hresult">
        <div class="sub">Sua hora vale</div>
        <div class="big" id="hVal">R$ —</div>
        <div class="sub" id="hUSD"></div>
        <div class="sub" style="margin-top:6px;opacity:.4">inclui 10% para imprevistos</div>
      </div>
    </div>
    <div class="hbox">
      <h3>📊 Faturamento</h3>
      <div class="fkpis" id="fKpis"></div>
      <table class="ftbl">
        <thead><tr><th>Mês/Ano</th><th>Receita</th><th>Projetos</th><th>Média</th><th></th></tr></thead>
        <tbody id="fBody"></tbody>
      </table>
      <button class="btn pri" style="margin-top:10px;font-size:12px" onclick="addFatur()">+ Registrar mês</button>
    </div>
  </div>
</section>

<!-- TABELA DE PREÇOS -->
<section class="tab" id="tab-precos">
  <div class="backup-bar"><button class="btn" onclick="doBackup()">⬇ Backup JSON</button></div>
  <div class="sec-bar" style="margin-bottom:16px">
    <span>Serviços — vinculados ao valor/hora</span>
    <div style="display:flex;gap:6px">
      <button class="btn" style="font-size:12px" onclick="addCat()">+ Categoria</button>
      <button class="btn pri" style="font-size:12px" onclick="addSvc()">+ Serviço</button>
    </div>
  </div>
  <div id="svcList" style="margin-bottom:28px"></div>
  <div class="sec-bar">
    <span>Pacotes</span>
    <button class="btn pri" style="font-size:12px" onclick="addPkg()">+ Pacote</button>
  </div>
  <div class="pkg-grid" id="pkgList" style="margin-top:14px"></div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="mbox">
    <button class="xbtn" onclick="closeM()">×</button>
    <div id="mBody"></div>
  </div>
</div>

<div class="sync" id="sync"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyD-ShgIdNfeRkvNJggsAnjCRvbTLSn77K4",authDomain:"dapaz-27b30.firebaseapp.com",projectId:"dapaz-27b30",storageBucket:"dapaz-27b30.firebasestorage.app",messagingSenderId:"415501535465",appId:"1:415501535465:web:dcc7369fc53428029d0878"});
const db=getFirestore(app);
const D=p=>doc(db,...p.split('/'));
const dot=document.getElementById('sync');
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// ── TABS ──
document.getElementById('nav').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(s=>s.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('tab-'+e.target.dataset.tab).classList.add('active');
  if(e.target.dataset.tab==='hora')setTimeout(initHora,30);
  if(e.target.dataset.tab==='precos')setTimeout(()=>{renderSvcs();renderPkgs();},30);
});

// ── MODAL ──
window.closeM=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM();});
function openM(html){document.getElementById('mBody').innerHTML=html;document.getElementById('modal').classList.add('open');}

// ── STATE ──
let posts=[],rows=[],hls=[];
let costs=JSON.parse(localStorage.getItem('dp_c')||'[{"l":"Energia","v":200},{"l":"Internet","v":120},{"l":"Celular","v":150},{"l":"Alimentação","v":1000},{"l":"Transporte","v":350},{"l":"Adobe","v":124},{"l":"Aluguel","v":6000}]');
let svcs=JSON.parse(localStorage.getItem('dp_s')||'null')||[
  {cat:'Identidade Visual',items:[{n:'Pacote Básico',h:20,r:2800},{n:'Pacote Intermediário',h:30,r:4200},{n:'Pacote Completo',h:45,r:6500}]},
  {cat:'Logo',items:[{n:'Logo Empresa',h:10,r:900},{n:'Redesign de Logo',h:8,r:600},{n:'Manual de Uso',h:4,r:380}]},
  {cat:'Social Media',items:[{n:'Arte feed',h:1,r:35},{n:'Arte story',h:.5,r:15},{n:'Carrossel',h:3,r:100},{n:'Reel animado',h:5,r:150},{n:'Padronização Social',h:12,r:480}]},
  {cat:'Planos Mensais',items:[{n:'Plano Rede Ativa',h:20,r:320},{n:'Plano Rede Ativa Plus',h:30,r:480}]},
  {cat:'Sites',items:[{n:'Landing Page',h:40,r:1000},{n:'Site Institucional',h:80,r:1800},{n:'E-commerce',h:120,r:2500}]}
];
let pkgs=JSON.parse(localStorage.getItem('dp_p')||'null')||[
  {name:'Pacote Lançamento',disc:15,items:['Logo Empresa','Landing Page','Padronização Social'],feat:false},
  {name:'Identidade Completa',disc:20,items:['Pacote Completo','Manual de Uso','Padronização Social'],feat:true}
];

let dragSrc=null;
function renderFeed(){
  const g=document.getElementById('feedGrid');g.innerHTML='';
  const bp=document.getElementById('bioPosts');if(bp)bp.textContent=posts.length;
  posts.forEach((p,i)=>{
    const d=document.createElement('div');d.className='gi';d.draggable=true;
    const m=p.media&&p.media[0];
    if(m)d.innerHTML=m.type==='video'?`<video src="${m.src}" muted playsinline></video>`:`<img src="${m.src}" loading="lazy">`;
    else d.innerHTML=`<div class="gph">sem mídia</div>`;
    if(p.media&&p.media.length>1)d.innerHTML+=`<div class="gbadge">⧉${p.media.length}</div>`;
    else if(m&&m.type==='video')d.innerHTML+=`<div class="gbadge">▶</div>`;
    d.innerHTML+=`<div class="ghandle">⠿</div>`;
    d.addEventListener('dragstart',e=>{dragSrc=i;d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>document.querySelectorAll('.gi').forEach(x=>x.classList.remove('dragging','dragover')));
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('dragover');});
    d.addEventListener('dragleave',()=>d.classList.remove('dragover'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('dragover');if(dragSrc===null||dragSrc===i)return;const mv=posts.splice(dragSrc,1)[0];posts.splice(i,0,mv);setDoc(D('hub/posts'),{items:posts});});
    d.addEventListener('click',ev=>{if(ev.target.classList.contains('ghandle'))return;viewPost(i);});
    g.appendChild(d);
  });
  const add=document.createElement('div');add.className='add-gi';add.textContent='+';add.onclick=()=>openEditor();
  g.appendChild(add);
}
function viewPost(i){
  const p=posts[i];let mh='';
  if(p.media&&p.media.length>1)mh=`<div class="car-track">${p.media.map(m=>m.type==='video'?`<video src="${m.src}" controls style="height:180px;border-radius:8px"></video>`:`<img src="${m.src}" style="height:180px;border-radius:8px;object-fit:cover">`).join('')}</div>`;
  else if(p.media&&p.media[0]){const m=p.media[0];mh=m.type==='video'?`<video src="${m.src}" controls style="width:100%;border-radius:8px;margin-bottom:10px;max-height:280px"></video>`:`<img src="${m.src}" style="width:100%;border-radius:8px;margin-bottom:10px;object-fit:cover;max-height:280px">`;}
  openM(`${mh}<div class="muted" style="font-size:12px;margin-bottom:6px">${p.date||''}</div><div style="font-size:14px;line-height:1.6">${(p.caption||'').replace(/\n/g,'<br>')}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="editPost(${i})">editar</button><button class="btn" onclick="delPost(${i})">excluir</button></div>`);
}
window.delPost=i=>{posts.splice(i,1);setDoc(D('hub/posts'),{items:posts});closeM();};
window.editPost=i=>openEditor(i);
window.openEditor=function(idx){
  const edit=idx!==undefined,p=edit?posts[idx]:{media:[],caption:'',date:new Date().toISOString().slice(0,10)};
  let tmp=[...(p.media||[])];let ciDrag=null;
  openM(`<h3 style="margin-bottom:14px">${edit?'Editar post':'Novo post'}</h3>
    <div class="mfield"><label>Mídia — imagem ou vídeo (pode adicionar vários)</label><input type="file" id="mIn" accept="image/*,video/*" multiple style="margin-top:4px"></div>
    <div id="mPrev" style="margin-bottom:10px"></div>
    <div class="mfield"><label>Data</label><input type="date" id="pDate" value="${p.date}"></div>
    <div class="mfield"><label>Legenda</label><textarea id="pCap" rows="4">${p.caption||''}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="savePost(${edit?idx:'undefined'})">salvar</button><button class="btn" onclick="closeM()">cancelar</button></div>`);
  function rp(){
    const prev=document.getElementById('mPrev');if(!prev)return;
    if(tmp.length<=1){
      prev.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
      prev.innerHTML=tmp.map((m,i)=>`<div style="position:relative"><${m.type==='video'?'video':'img'} src="${m.src}" style="width:70px;height:70px;object-fit:cover;border-radius:8px" ${m.type==='video'?'muted':''}><div onclick="tmp.splice(${i},1);rp()" style="position:absolute;top:-5px;right:-5px;background:var(--boto);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer">×</div></div>`).join('');
    } else {
      prev.style.cssText='display:block';
      prev.innerHTML=tmp.map((m,i)=>`<div class="ci" draggable="true" data-i="${i}"><span style="color:var(--muted);font-size:16px;user-select:none">⠿</span><${m.type==='video'?'video':'img'} src="${m.src}" style="width:48px;height:48px;object-fit:cover;border-radius:6px" ${m.type==='video'?'muted':''}><span style="flex:1;font-size:12px;color:var(--muted)">Slide ${i+1}</span><span onclick="tmp.splice(${i},1);rp()" style="cursor:pointer;color:var(--muted);font-size:14px">✕</span></div>`).join('');
      prev.querySelectorAll('.ci').forEach(el=>{
        el.addEventListener('dragstart',e=>{ciDrag=+el.dataset.i;el.classList.add('cidrag');e.dataTransfer.effectAllowed='move';});
        el.addEventListener('dragend',()=>prev.querySelectorAll('.ci').forEach(x=>x.classList.remove('cidrag')));
        el.addEventListener('dragover',e=>e.preventDefault());
        el.addEventListener('drop',e=>{e.preventDefault();const ti=+el.dataset.i;if(ciDrag===null||ciDrag===ti)return;const mv=tmp.splice(ciDrag,1)[0];tmp.splice(ti,0,mv);rp();});
      });
    }
  }
  rp();
  document.getElementById('mIn')?.addEventListener('change',e=>{
    [...e.target.files].forEach(f=>{const r=new FileReader();r.onload=ev=>{tmp.push({type:f.type.startsWith('video')?'video':'image',src:ev.target.result});rp();};r.readAsDataURL(f);});
  });
  window.savePost=(i)=>{
    const d={media:tmp,caption:document.getElementById('pCap').value,date:document.getElementById('pDate').value};
    if(i!==undefined&&i!=='undefined')posts[i]=d;else posts.push(d);
    setDoc(D('hub/posts'),{items:posts});closeM();
  };
};

window.calcH=function(){
  const sal=+document.getElementById('cSal')?.value||0,hpd=+document.getElementById('cHpd')?.value||4,
        dpw=+document.getElementById('cDpw')?.value||5,fer=+document.getElementById('cFer')?.value||0;
  const tc=costs.reduce((a,c)=>a+(+c.v||0),0);
  const hrs=hpd*dpw*(52-fer)/12;
  const h=hrs>0?(sal+tc)/hrs*1.1:0;
  const hEl=document.getElementById('hVal'),hU=document.getElementById('hUSD');
  if(hEl)hEl.textContent=h>0?'R$ '+h.toFixed(2):'—';
  if(hU)hU.textContent=h>0?'≈ $'+(h/usd).toFixed(2)+' USD':'';
  localStorage.setItem('dp_hora',h.toFixed(2));
  renderSvcs();renderPkgs();
};

    <div class="mfield"><label>Desconto %</label><input id="pd" type="number" value="${pkg.disc}"></div>
    <div class="mfield"><label>Serviços incluídos</label>
      <div style="max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:4px">
        ${all.map(s=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer"><input type="checkbox" value="${s}" ${pkg.items.includes(s)?'checked':''}> ${s}</label>`).join('')}
      </div></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="pf" ${pkg.feat?'checked':''}> Destacar pacote</label>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="savePkgE(${pi})">salvar</button><button class="btn" onclick="closeM()">cancelar</button></div>`);
};
window.savePkgE=pi=>{
  pkgs[pi].name=document.getElementById('pn').value;
  pkgs[pi].disc=+document.getElementById('pd').value||0;
  pkgs[pi].feat=document.getElementById('pf').checked;
  pkgs[pi].items=[...document.querySelectorAll('#mBody input[type=checkbox]:checked')].map(e=>e.value);
  sL();renderPkgs();closeM();
};

// ── BACKUP ──
window.doBackup=()=>{
  const data={posts,rows,hls,svcs,pkgs,faturs,costs,date:new Date().toISOString()};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='dapaz_'+new Date().toISOString().slice(0,10)+'.json';a.click();
};

dot.style.background='#4c8c5c';
</script>
</body>
</html>
